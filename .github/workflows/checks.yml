name: Warehouse checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional report adapter and virtual display
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Run inventory and order regression tests
        run: python -m unittest discover -s tests -v
      - name: Exercise real Tkinter widgets with synthetic data
        run: xvfb-run -a python advancepython3.py --smoke-test
